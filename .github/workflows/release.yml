name: release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v0.1.0). Defaults to Cargo.toml when omitted.'
        required: false
        type: string

permissions:
  actions: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  GITHUB_REGISTRY: ghcr.io

jobs:
  resolve:
    name: Resolve image tag
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.resolve.outputs.image_name }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      is_release: ${{ steps.resolve.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: resolve
        run: |
          echo "image_name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "image_tag=main" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          VERSION="$(python3 - <<'PYV'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              print(tomllib.load(f)["package"]["version"])
          PYV
          )"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -z "${{ github.event.inputs.version }}" ]]; then
            TAG="v${VERSION}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          test "${TAG#v}" = "$VERSION" || { echo "Cargo version $VERSION does not match tag $TAG"; exit 1; }
          echo "image_tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "is_release=true" >> $GITHUB_OUTPUT

  docker:
    name: Docker ${{ matrix.arch }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.GITHUB_REGISTRY }}/${{ needs.resolve.outputs.image_name }}:${{ needs.resolve.outputs.image_tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=maxio-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=maxio-${{ matrix.arch }}

  docker-manifest:
    name: Docker Manifest
    needs: [resolve, docker]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & publish manifest
        run: |
          TAG="${{ needs.resolve.outputs.image_tag }}"
          EXTRA_TAG=""
          if [[ "${{ needs.resolve.outputs.is_release }}" == "true" ]]; then
            EXTRA_TAG="--tag ${{ env.GITHUB_REGISTRY }}/${{ needs.resolve.outputs.image_name }}:latest"
          fi
          docker buildx imagetools create \
            ${{ env.GITHUB_REGISTRY }}/${{ needs.resolve.outputs.image_name }}:${TAG}-amd64 \
            ${{ env.GITHUB_REGISTRY }}/${{ needs.resolve.outputs.image_name }}:${TAG}-aarch64 \
            --tag ${{ env.GITHUB_REGISTRY }}/${{ needs.resolve.outputs.image_name }}:${TAG} \
            ${EXTRA_TAG}
