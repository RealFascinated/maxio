name: release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v0.1.0). Defaults to Cargo.toml when omitted.'
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  GITHUB_REGISTRY: ghcr.io

jobs:
  resolve:
    name: Resolve image tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      is_release: ${{ steps.resolve.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "image_tag=main" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          VERSION="$(python3 - <<'PYV'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              print(tomllib.load(f)["package"]["version"])
          PYV
          )"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -z "${{ github.event.inputs.version }}" ]]; then
            TAG="v${VERSION}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          test "${TAG#v}" = "$VERSION" || { echo "Cargo version $VERSION does not match tag $TAG"; exit 1; }
          echo "image_tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "release_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "is_release=true" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.target }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: maxio-linux-amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            artifact: maxio-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install libpq
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend deps
        run: bun install --frozen-lockfile
        working-directory: ui

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --all --all-features

      - name: Build frontend
        run: bun run build
        working-directory: ui

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        if: needs.resolve.outputs.is_release == 'true'
        run: |
          VERSION="$(python3 - <<'PYV'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              print(tomllib.load(f)["package"]["version"])
          PYV
          )"
          ARCHIVE="${{ matrix.artifact }}-${VERSION}.tar.gz"
          cp target/${{ matrix.target }}/release/maxio maxio
          tar czf "${ARCHIVE}" maxio
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      - name: Upload artifact
        if: needs.resolve.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.ARCHIVE }}

  docker:
    name: Docker ${{ matrix.arch }}
    needs: [resolve, build]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.GITHUB_REGISTRY }}/${{ github.repository }}:${{ needs.resolve.outputs.image_tag }}-${{ matrix.arch }}

  docker-manifest:
    name: Docker Manifest
    needs: [resolve, build, docker]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & publish manifest
        run: |
          TAG="${{ needs.resolve.outputs.image_tag }}"
          EXTRA_TAG=""
          if [[ "${{ needs.resolve.outputs.is_release }}" == "true" ]]; then
            EXTRA_TAG="--tag ${{ env.GITHUB_REGISTRY }}/${{ github.repository }}:latest"
          fi
          docker buildx imagetools create \
            ${{ env.GITHUB_REGISTRY }}/${{ github.repository }}:${TAG}-amd64 \
            ${{ env.GITHUB_REGISTRY }}/${{ github.repository }}:${TAG}-aarch64 \
            --tag ${{ env.GITHUB_REGISTRY }}/${{ github.repository }}:${TAG} \
            ${EXTRA_TAG}

  release:
    name: Create Release
    needs: [resolve, build]
    if: needs.resolve.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: maxio-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          files: '*.tar.gz'
