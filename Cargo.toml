[package]
name = "maxio"
version = "0.4.2"
edition = "2024"
description = "S3-compatible object storage server — single-binary replacement for MinIO"
license = "Apache-2.0"
repository = "https://github.com/coollabsio/maxio"
authors = ["MaxIO Contributors"]
keywords = ["s3", "object-storage", "minio", "storage", "server"]
categories = ["web-programming::http-server", "filesystem"]

[dependencies]
# HTTP server
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
hyper = "1"
http = "1"
bytes = "1"

# XML
quick-xml = { version = "0.40", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth / crypto
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
clap = { version = "4", features = ["derive", "env"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1"
crc32c = "0.6"
aws-lc-rs = "1"
aws-lc-sys = "0.41"
percent-encoding = "2"
thiserror = "2"
anyhow = "1"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
serde_urlencoded = "0.7"
base64 = "0.22"

# Embedded UI assets
rust-embed = "8"
mime_guess = "2"
rand = "0.10.1"

# Metrics
prometheus = { version = "0.14", features = ["process"] }

# Database
diesel = { version = "2.3", features = ["postgres", "chrono", "uuid", "serde_json"] }
diesel-async = { version = "0.9", features = ["postgres", "deadpool", "async-connection-wrapper", "tokio"] }
diesel_migrations = "2.3"
deadpool-diesel = "0.6"
async-trait = "0.1"
lru = "0.18"

[dev-dependencies]
reqwest = { version = "0.13", features = ["json"] }
percent-encoding = "2"
tempfile = "3"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
